      };
    });
    const durTrend = (days) => dailySeries(db, ids.filter((id) => !findP(db, id).streaming), days, now, (l) => U.avg(l, (e) => (e.durationSec || 0) / 60));
    const byP = ps.map((p) => {
      const l = all.filter((e) => e.pipelineId === p.id);
      return { id: p.id, name: p.name, gb: U.sum(l, (e) => e.volumeInGB || 0), records: U.sum(l, (e) => e.recordsRead || 0) };
    }).sort((a, b) => b.gb - a.gb);
    return {
      range, series,
      totals: { records: U.sum(series, (s) => s.records), gbIn: U.sum(series, (s) => s.gbIn), gbOut: U.sum(series, (s) => s.gbOut), runs: all.length,
        recPerMin: U.sum(series, (s) => s.records) / ((bs[bs.length - 1].to - bs[0].from) / MIN), gbPerHour: U.sum(series, (s) => s.gbIn) / ((bs[bs.length - 1].to - bs[0].from) / HOUR) },
      duration7: { labels: lastDays(7, now), values: durTrend(7) },
      duration30: { labels: lastDays(30, now), values: durTrend(30) },
      topVolume: byP.slice(0, 10)
    };
  };
  function lastDays(n, now) { const d = new Date(now); d.setHours(0, 0, 0, 0); const out = []; for (let i = n - 1; i >= 0; i--) out.push(n <= 7 ? U.fmtDow(d.getTime() - i * DAY) : U.fmtDay(d.getTime() - i * DAY)); return out; }

  MockAdapter.prototype.getOpsMetrics = function (f) {
    const now = Date.now(), db = this.db(f.env);
    const ps = filtered(db, f, now), ids = ps.map((p) => p.id);
    const range = f.range || '24h';
    const bs = buckets(range, now);
    const all = execsIn(db, ids, bs[0].from, now + 1, now);
    const batch = all.filter((e) => !findP(db, e.pipelineId).streaming);
    const done = all.filter((e) => e.status === 'success' || e.status === 'failed');
    const series = bs.map((b) => {
      const l = inBucket(all, b);
      return { label: b.label, count: l.length, retries: U.sum(l, (e) => e.retries || 0), queue: U.avg(l, (e) => e.queueSec || 0), depWait: U.avg(l, (e) => e.depWaitSec || 0), failRate: l.length ? 100 * l.filter((e) => e.status === 'failed').length / l.length : 0 };
    });
    // compute utilisation by hour of day (last 24h)
    const util = [];
    for (let i = 23; i >= 0; i--) {
      const s = Math.floor(now / HOUR) * HOUR - i * HOUR, e2 = s + HOUR;
      let busy = 0;
      execsIn(db, ids, now - 2 * DAY, now + 1, now).forEach((e) => { const st = Math.max(e.start, s), en = Math.min(e.end || now, e2); if (en > st) busy += (en - st) * (findP(db, e.pipelineId).platform === 'databricks' ? 2.2 : 1); });
      util.push({ label: U.fmtHM(s), value: Math.min(98, 100 * busy / (HOUR * 9.5)) });
    }
    const perPipeline = ps.map((p) => {
      const l = batch.filter((e) => e.pipelineId === p.id && e.durationSec);
      const lastOk = db.byPipeline[p.id].find((e) => e.status === 'success' && e.end);
      const freshMin = lastOk ? (now - lastOk.end) / MIN : null;
      const expect = p.schedule.everyMin + p.sla.maxDurationMin;
      return {
        id: p.id, name: p.name, streaming: p.streaming, platform: p.platformShort,
        avgMin: l.length ? U.avg(l, (e) => e.durationSec) / 60 : null,
        maxMin: l.length ? U.max(l, (e) => e.durationSec) / 60 : null,
        freshnessMin: freshMin, expectedFreshMin: expect, stale: freshMin != null && freshMin > expect,
        depWaitMin: U.avg(all.filter((e) => e.pipelineId === p.id), (e) => e.depWaitSec || 0) / 60,
        runs: all.filter((e) => e.pipelineId === p.id).length
      };
    });
    const platforms = U.groupBy(all, (e) => findP(db, e.pipelineId).platformShort);
    return {
      range, series, util,
      tiles: {
        runs: all.length,
        avgDurMin: U.avg(batch.filter((e) => e.durationSec), (e) => e.durationSec) / 60,
        maxDurMin: batch.length ? U.max(batch, (e) => e.durationSec || 0) / 60 : 0,
        retries: U.sum(all, (e) => e.retries || 0),
        failureRate: done.length ? 100 * done.filter((e) => e.status === 'failed').length / done.length : 0,
        queueSec: U.avg(all, (e) => e.queueSec || 0),
        throughput: U.sum(all, (e) => e.recordsRead || 0) / ((now - bs[0].from) / MIN),
        computeUtil: U.avg(util, (u) => u.value),
        computeHours: U.sum(all, (e) => e.computeHours || 0),
        staleCount: perPipeline.filter((x) => x.stale).length,
        depWaitMin: U.avg(all.filter((e) => e.depWaitSec), (e) => e.depWaitSec) / 60
      },
      perPipeline,
      failureByPlatform: Object.keys(platforms).map((k) => { const l = platforms[k].filter((e) => e.status !== 'running'); return { label: k, runs: platforms[k].length, rate: l.length ? 100 * l.filter((e) => e.status === 'failed').length / l.length : 0 }; }).sort((a, b) => b.rate - a.rate)
    };
  };

  MockAdapter.prototype.getSla = function (f) {
    const now = Date.now(), db = this.db(f.env);
    const ps = filtered(db, f, now), ids = ps.map((p) => p.id);
    const range = f.range || '24h';
    const cur = execsIn(db, ids, now - RANGE_MS[range], now + 1, now).filter((e) => e.status !== 'running' || e.slaBreached);
    const rows = ps.map((p) => {
      const e = p.latest;
      const slaSec = p.sla.maxDurationMin * 60;
      const actual = e.start ? e.durationSec : (e.status === 'delayed' ? (now - e.scheduledTime) / 1000 : null);
      return { id: p.id, name: p.name, domain: p.domain, owner: p.owner, slaMin: p.sla.maxDurationMin, actualSec: actual, varianceSec: actual == null ? null : actual - slaSec, pct: actual == null ? null : 100 * actual / slaSec, status: p.slaStatus, running: e.status === 'running', execStatus: e.status, notStarted: !e.start };
    });
    const order = { breached: 0, at_risk: 1, met: 2, pending: 3 };
    rows.sort((a, b) => order[a.status] - order[b.status] || (b.pct || 0) - (a.pct || 0));
    const met = cur.filter((e) => !e.slaBreached).length;
    return {
      range,
      compliance: cur.length ? 100 * met / cur.length : 100,
      counts: { met: rows.filter((r) => r.status === 'met').length, at_risk: rows.filter((r) => r.status === 'at_risk').length, breached: rows.filter((r) => r.status === 'breached').length, pending: rows.filter((r) => r.status === 'pending').length },
      runsEvaluated: cur.length, breachedRuns: cur.length - met,
      trend: { labels: lastDays(30, now), values: dailySeries(db, ids, 30, now, (l) => { const d = l.filter((e) => e.status !== 'running'); return d.length ? 100 * d.filter((e) => !e.slaBreached).length / d.length : 100; }) },
      rows
    };
  };

  MockAdapter.prototype.getDataQuality = function (f) {
    const now = Date.now(), db = this.db(f.env);
    const ps = filtered(db, f, now);
    const checks = [];
    ps.forEach((p) => (db.dq[p.id] || []).forEach((c) => checks.push(Object.assign({ pipelineName: p.name, domain: p.domain, owner: p.owner }, c))));
    const byType = M.DQ_TYPES.map((t) => { const l = checks.filter((c) => c.type === t.type); return { type: t.type, name: t.name, pass: l.filter((c) => c.status === 'pass').length, warn: l.filter((c) => c.status === 'warn').length, fail: l.filter((c) => c.status === 'fail').length }; });
    const R = U.rng('dq-trend-' + f.env);
    const trend = lastDays(14, now).map((label, i) => {
      const total = checks.length;
      const fail = i === 13 ? checks.filter((c) => c.status === 'fail').length : R.int(0, 3);
      const warn = i === 13 ? checks.filter((c) => c.status === 'warn').length : R.int(1, 6);
      return { label, pass: total - fail - warn, warn, fail };
    });
    return {
      totals: { total: checks.length, pass: checks.filter((c) => c.status === 'pass').length, warn: checks.filter((c) => c.status === 'warn').length, fail: checks.filter((c) => c.status === 'fail').length },
      byType, trend,
      matrix: ps.map((p) => ({ id: p.id, name: p.name, domain: p.domain, cells: M.DQ_TYPES.map((t) => { const c = (db.dq[p.id] || []).find((x) => x.type === t.type); return c ? { status: c.status, observed: c.observed, expected: c.expected, name: c.name } : null; }) })),
      types: M.DQ_TYPES,
      issues: checks.filter((c) => c.status !== 'pass').sort((a, b) => (a.status === 'fail' ? 0 : 1) - (b.status === 'fail' ? 0 : 1))
    };
  };

  MockAdapter.prototype.getDependencies = function (f, internal) {
    const now = Date.now(), db = this.db(f.env);
    const health = {};
    db.pipelines.forEach((p) => { health[p.id] = pipelineHealth(db, p, now).health; });
    // depth (layer) for layout
    const depth = {};
    const dfs = (id) => { if (depth[id] != null) return depth[id]; const p = findP(db, id); depth[id] = p.upstream.length ? 1 + Math.max.apply(null, p.upstream.map(dfs)) : 0; return depth[id]; };
    db.pipelines.forEach((p) => dfs(p.id));
    // downstream impact (transitive) for failed / blocked / delayed nodes
    const children = {};
    db.pipelines.forEach((p) => p.upstream.forEach((u) => (children[u] = children[u] || []).push(p.id)));
    const impactOf = {};
    const walk = (id, seen) => (children[id] || []).forEach((c) => { if (!seen.has(c)) { seen.add(c); walk(c, seen); } });
    db.pipelines.forEach((p) => { const s = new Set(); walk(p.id, s); impactOf[p.id] = Array.from(s); });
    const impacted = new Set();
    db.pipelines.forEach((p) => { if (['failed', 'blocked', 'delayed'].indexOf(health[p.id]) >= 0) impactOf[p.id].forEach((x) => impacted.add(x)); });
    const visible = internal ? null : new Set(filtered(db, f, now).map((p) => p.id));
    const nodes = db.pipelines.map((p) => ({ id: p.id, name: p.name, domain: p.domain, platform: p.platformShort, status: health[p.id], layer: depth[p.id], impacted: impacted.has(p.id) && ['success', 'running'].indexOf(health[p.id]) < 0, atRisk: impacted.has(p.id), dim: visible ? !visible.has(p.id) : false, downstream: impactOf[p.id].length }));
    // consumers (BI / ML) as terminal nodes
    const maxL = Math.max.apply(null, nodes.map((n) => n.layer)) + 1;
    const consumers = [
      { id: 'c_powerbi', name: 'Power BI / Reporting', consumer: true, layer: maxL, from: ['exec_dashboard_refresh', 'finance_reporting', 'daily_revenue'] },
      { id: 'c_ml', name: 'ML / Churn Model', consumer: true, layer: maxL, from: ['churn_features'] },
      { id: 'c_mktg', name: 'Marketing Dashboards', consumer: true, layer: maxL, from: ['marketing_analytics'] }
    ];
    consumers.forEach((c) => { c.status = c.from.some((x) => ['failed', 'blocked', 'delayed'].indexOf(health[x]) >= 0 || impacted.has(x)) ? 'at_risk' : 'ok'; c.atRisk = c.status === 'at_risk'; });
    const edges = [];
    db.pipelines.forEach((p) => p.upstream.forEach((u) => edges.push({ from: u, to: p.id, broken: ['failed', 'blocked', 'delayed'].indexOf(health[u]) >= 0 || (impacted.has(u) && ['success'].indexOf(health[u]) < 0) })));
    consumers.forEach((c) => c.from.forEach((u) => edges.push({ from: u, to: c.id, broken: ['failed', 'blocked', 'delayed'].indexOf(health[u]) >= 0 || (impacted.has(u) && health[u] !== 'success') })));
    return { nodes: nodes.concat(consumers), edges, impactOf, blockedCount: nodes.filter((n) => n.status === 'blocked' || n.impacted).length };
  };

  MockAdapter.prototype.search = function (env, q) {
    const db = this.db(env), s = q.toLowerCase();
    const ps = db.pipelines.filter((p) => (p.name + ' ' + p.id + ' ' + p.domain + ' ' + p.owner + ' ' + p.source + ' ' + p.target).toLowerCase().indexOf(s) >= 0).slice(0, 6).map((p) => ({ kind: 'pipeline', id: p.id, label: p.name, sub: p.domain + ' · ' + p.platformName }));
    const ex = db.executions.filter((e) => e.id.indexOf(s) >= 0).slice(0, 4).map((e) => ({ kind: 'execution', id: e.id, pipelineId: e.pipelineId, label: e.id, sub: nameOf(db, e.pipelineId) }));
    const al = db.alerts.filter((a) => (a.title + ' ' + a.description).toLowerCase().indexOf(s) >= 0).slice(0, 4).map((a) => ({ kind: 'alert', id: a.id, pipelineId: a.pipelineId, label: a.title, sub: a.severity + ' · ' + a.pipelineName }));
    return ps.concat(ex, al);
  };

  /* ======================================================================
     REST adapter — same contract, real HTTP. Endpoints documented in README.
     ====================================================================== */
  function RestAdapter(base) { this.base = base; }
  RestAdapter.prototype.get = function (path, params) {
    const qs = params ? '?' + Object.keys(params).filter((k) => params[k] !== '' && params[k] != null).map((k) => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&') : '';
    return fetch(this.base + path + qs, { headers: { Accept: 'application/json' } }).then((r) => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); });
  };
  RestAdapter.prototype.send = function (method, path, body) {
    return fetch(this.base + path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => r.json());
  };
  const R = RestAdapter.prototype;
  R.getFilterOptions = function (f) { return this.get('/filters', { env: f.env }); };
  R.getOverview = function (f) { return this.get('/overview', f); };
  R.getPipelines = function (f) { return this.get('/pipelines', f); };
  R.getPipeline = function (env, id) { return this.get('/pipelines/' + id, { env }); };
  R.getExecutions = function (env, id, limit) { return this.get('/pipelines/' + id + '/executions', { env, limit }); };
  R.getExecution = function (env, execId) { return this.get('/executions/' + execId, { env }); };
  R.getLogs = function (env, execId) { return this.get('/executions/' + execId + '/logs', { env }); };
  R.getAlerts = function (f) { return this.get('/alerts', f); };
  R.updateAlert = function (env, id, patch) { return this.send('PATCH', '/alerts/' + id + '?env=' + env, patch); };
  R.rerun = function (env, id) { return this.send('POST', '/pipelines/' + id + '/runs?env=' + env); };
  R.getTimeline = function (f, hours) { return this.get('/timeline', Object.assign({ hours }, f)); };
  R.getDataMetrics = function (f) { return this.get('/metrics/data', f); };
  R.getOpsMetrics = function (f) { return this.get('/metrics/operations', f); };
  R.getSla = function (f) { return this.get('/sla', f); };
  R.getDataQuality = function (f) { return this.get('/data-quality', f); };
  R.getDependencies = function (f) { return this.get('/dependencies', f); };
  R.search = function (env, q) { return this.get('/search', { env, q }); };

  /* ======================================================================
     Public API — async facade, adapter chosen by config
     ====================================================================== */
  let adapter = null;
  function A() {
    if (!adapter) adapter = OC.config.dataSource === 'rest' ? new RestAdapter(OC.config.apiBaseUrl) : new MockAdapter();
    return adapter;
  }
  const wrap = (name) => function () {
    const ad = A();
    const r = ad[name].apply(ad, arguments);
    return r && typeof r.then === 'function' ? r : delay(r);
  };
  OC.api = {};
  ['getFilterOptions', 'getOverview', 'getPipelines', 'getPipeline', 'getExecutions', 'getExecution', 'getLogs', 'getAlerts', 'updateAlert', 'rerun',
    'getTimeline', 'getDataMetrics', 'getOpsMetrics', 'getSla', 'getDataQuality', 'getDependencies', 'search'].forEach((n) => { OC.api[n] = wrap(n); });
})(window.OpsCenter);

  <script>
/* ==========================================================================

(function (OC) {

  function legendHtml(series, type) {

  }
  function xLabelIdx(n, iw) {
    const maxLabels = Math.max(2, Math.floor(iw / 62));
    const step = Math.max(1, Math.ceil(n / maxLabels));
    const out = [];
    for (let i = 0; i < n; i += step) out.push(i);
    return out;
  }
  function yAxis(f, max, fmt, min) {
    min = min || 0;
    let s = '';
    for (let i = 0; i <= 4; i++) {
      const v = min + (max - min) * i / 4;
      const y = f.m.t + f.ih - f.ih * i / 4;
      s += '<line class="' + (i === 0 ? 'axisline' : 'gridline') + '" x1="' + f.m.l + '" x2="' + (f.W - f.m.r) + '" y1="' + y + '" y2="' + y + '"/>';
      s += '<text x="' + (f.m.l - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmt(v) + '</text>';
    }

  }

  /* ---------- Line / area ---------- */
  function line(el, o) {
    const f = frame(el, o);
    const fmt = o.yFmt || ((v) => U.fmtNum(v));
    const n = o.labels.length;
    const all = [].concat.apply([], o.series.map((s) => s.values));
    const min = o.yMin != null ? o.yMin : 0;
    const max = o.yMax != null ? o.yMax : niceMax(Math.max.apply(null, all.concat([o.ref ? o.ref.value : 0])) * 1.05);
    const x = (i) => f.m.l + (n === 1 ? f.iw / 2 : (f.iw * i) / (n - 1));
    const y = (v) => f.m.t + f.ih - (f.ih * (U.clamp(v, min, max) - min)) / (max - min || 1);
    let s = yAxis(f, max, fmt, min);
    xLabelIdx(n, f.iw).forEach((i) => { s += '<text x="' + x(i) + '" y="' + (f.H - 6) + '" text-anchor="middle">' + U.esc(o.labels[i]) + '</text>'; });
    if (o.ref) {
      const ry = y(o.ref.value);
      s += '<line x1="' + f.m.l + '" x2="' + (f.W - f.m.r) + '" y1="' + ry + '" y2="' + ry + '" stroke="' + (o.ref.color || 'var(--warn)') + '" stroke-dasharray="4 4" stroke-width="1"/>';
      s += '<text x="' + (f.W - f.m.r) + '" y="' + (ry - 5) + '" text-anchor="end" style="fill:' + (o.ref.color || 'var(--warn)') + '">' + U.esc(o.ref.label) + '</text>';
    }
    o.series.forEach((ser, si) => {
      const pts = ser.values.map((v, i) => [x(i), y(v)]);
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
      if (ser.area) {
        const gid = 'g' + Math.random().toString(36).slice(2, 8);
        s += '<defs><linearGradient id="' + gid + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + ser.color + '" stop-opacity="0.28"/><stop offset="1" stop-color="' + ser.color + '" stop-opacity="0.02"/></linearGradient></defs>';
        s += '<path d="' + d + 'L' + x(n - 1) + ',' + y(min) + 'L' + x(0) + ',' + y(min) + 'Z" fill="url(#' + gid + ')"/>';
      }
      s += '<path d="' + d + '" fill="none" stroke="' + ser.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + (ser.dash ? ' stroke-dasharray="5 4"' : '') + '/>';
      const last = pts[pts.length - 1];
      if (last) s += '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="' + ser.color + '" stroke="var(--panel)" stroke-width="2"/>';
    });
    s += '<g class="hover-layer" style="display:none"><line class="crosshair" y1="' + f.m.t + '" y2="' + (f.m.t + f.ih) + '"/>' + o.series.map((ser) => '<circle r="4.5" fill="' + ser.color + '" stroke="var(--panel)" stroke-width="2"/>').join('') + '</g>';
    s += '<rect class="hit" x="' + f.m.l + '" y="' + f.m.t + '" width="' + f.iw + '" height="' + f.ih + '"/>';
    el.innerHTML = legendHtml(o.series, 'line') + '<svg class="chart" width="' + f.W + '" height="' + f.H + '" viewBox="0 0 ' + f.W + ' ' + f.H + '">' + s + '</svg>';
    const svg = el.querySelector('svg'), hit = svg.querySelector('.hit'), layer = svg.querySelector('.hover-layer');
    hit.addEventListener('mousemove', (ev) => {
      const r = svg.getBoundingClientRect();
      const px = ev.clientX - r.left;
      const i = U.clamp(Math.round(((px - f.m.l) / f.iw) * (n - 1)), 0, n - 1);
      layer.style.display = '';
      const cl = layer.querySelector('line'); cl.setAttribute('x1', x(i)); cl.setAttribute('x2', x(i));
      layer.querySelectorAll('circle').forEach((c, si) => { c.setAttribute('cx', x(i)); c.setAttribute('cy', y(o.series[si].values[i])); });
      const tf = o.tipFmt || fmt;
      tip().show('<div class="tt-h">' + U.esc(o.tipLabels ? o.tipLabels[i] : o.labels[i]) + '</div>' + o.series.map((ser) => OC.ui.ttRow(ser.color, ser.name, tf(ser.values[i]))).join(''), ev.clientX, ev.clientY, 'chart');

  /* ---------- Bars (grouped or stacked) ---------- */
  function roundTop(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    if (h <= 0) return '';

  }
  function bars(el, o) {
    const f = frame(el, o);
    const fmt = o.yFmt || ((v) => U.fmtNum(v));
    const n = o.labels.length;
    const totals = o.labels.map((_, i) => o.stacked ? U.sum(o.series, (s) => s.values[i] || 0) : Math.max.apply(null, o.series.map((s) => s.values[i] || 0)));

    const gap = Math.max(1, Math.min(band * 0.28, 10));

    const y = (v) => f.m.t + f.ih - (f.ih * v) / max;
    let s = yAxis(f, max, fmt);
    xLabelIdx(n, f.iw).forEach((i) => { s += '<text x="' + (f.m.l + band * i + band / 2) + '" y="' + (f.H - 6) + '" text-anchor="middle">' + U.esc(o.labels[i]) + '</text>'; });
    for (let i = 0; i < n; i++) {

    }
    for (let i = 0; i < n; i++) s += '<rect class="hit" data-i="' + i + '" x="' + (f.m.l + band * i) + '" y="' + f.m.t + '" width="' + band + '" height="' + f.ih + '" style="cursor:' + (o.onClick ? 'pointer' : 'default') + '"/>';
    el.innerHTML = legendHtml(o.series, 'bar') + '<svg class="chart" width="' + f.W + '" height="' + f.H + '" viewBox="0 0 ' + f.W + ' ' + f.H + '">' + s + '</svg>';
    const svg = el.querySelector('svg');

        tip().show('<div class="tt-h">' + U.esc(o.tipLabels ? o.tipLabels[i] : o.labels[i]) + '</div>' + rows + (o.stacked && o.series.length > 1 ? OC.ui.ttRow('', 'Total', tf(totals[i])) : ''), ev.clientX, ev.clientY, 'chart');

  /* ---------- Donut ---------- */

      p.addEventListener('mousemove', (ev) => { p.setAttribute('stroke-width', th + 4); tip().show('<div class="tt-h">' + U.esc(seg.label) + '</div>' + OC.ui.ttRow(seg.color, 'Count', seg.value) + OC.ui.ttRow('', 'Share', U.fmtPct(100 * seg.value / total)), ev.clientX, ev.clientY, 'chart'); });
      p.addEventListener('mouseleave', () => { p.setAttribute('stroke-width', th); tip().hide(); });

    });

  /* ---------- Gauge (semicircle) ---------- */
  function gauge(el, o) {
    const W = o.width || 220, H = W * 0.62, cx = W / 2, cy = H - 14, r = W / 2 - 18, th = 14;
    const min = o.min || 0, max = o.max || 100;

    let s = '<path d="' + arc(cx, cy, r, Math.PI, 2 * Math.PI) + '" fill="none" stroke="var(--panel-3)" stroke-width="' + th + '" stroke-linecap="round"/>';

  }

  /* ---------- Sparkline (returns markup) ---------- */
  function sparkline(values, color, w, h) {
    w = w || 84; h = h || 24;
    if (!values || !values.length) return '';
    const max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    const rng = max - min || 1;
    const pts = values.map((v, i) => [(w * i) / (values.length - 1 || 1), h - 2 - ((h - 4) * (v - min)) / rng]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible"><path d="' + d + 'L' + w + ',' + h + 'L0,' + h + 'Z" fill="' + color + '" opacity="0.12"/><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"/><circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="2.2" fill="' + color + '"/></svg>';
  }

  OC.charts = { line, bars, donut, gauge, sparkline, niceMax };
})(window.OpsCenter);

  <script>
/* ==========================================================================
   Reusable dashboard widgets — pipeline table, timeline (Gantt), alert list,
   horizontal bar list. Used by several views.
   ========================================================================== */
(function (OC) {
  'use strict';
  const U = OC.utils, ui = OC.ui;
  const W = {};

  /* ---------- Pipeline table ---------- */
  const COLS = [
    { k: 'name', t: 'Pipeline', sort: (r) => r.name },
    { k: 'domain', t: 'Domain', sort: (r) => r.domain },
    { k: 'st', t: 'Source → Target', sort: (r) => r.source },
    { k: 'type', t: 'Type', sort: (r) => r.type },
    { k: 'status', t: 'Status', sort: (r) => ['failed', 'delayed', 'blocked', 'warning', 'running', 'queued', 'success'].indexOf(r.status) },
    { k: 'start', t: 'Start Time', sort: (r) => r.startTime || 0 },
    { k: 'dur', t: 'Duration', sort: (r) => r.durationSec || 0 },
    { k: 'records', t: 'Records', sort: (r) => r.recordsProcessed || 0, r: true },
    { k: 'last', t: 'Last Run', sort: (r) => r.lastRun || 0 },
    { k: 'sla', t: 'SLA', sort: (r) => ['breached', 'at_risk', 'met', 'pending'].indexOf(r.slaStatus) },
    { k: 'trend', t: 'Last 14 runs' }
  ];
  const COMPACT = ['name', 'status', 'dur', 'records', 'last', 'sla'];

  function durCell(r) {
    if (r.durationSec == null) {
      if (r.status === 'delayed') return '<span class="sla-at_risk">Not started · ' + U.fmtAgo(r.scheduledTime).replace(' ago', '') + ' late</span>';
      return '<span class="muted">—</span>';
    }
    const pct = 100 * r.durationSec / (r.sla.maxDurationMin * 60);
    const col = pct > 100 ? 'var(--fail)' : pct >= 80 ? 'var(--warn)' : r.execStatus === 'running' ? 'var(--run)' : 'var(--ok)';
    return '<div class="durbar" data-tip="' + U.esc('<div class="tt-h">' + U.fmtDur(r.durationSec) + ' of ' + U.fmtMin(r.sla.maxDurationMin) + ' SLA</div>' + ui.ttRow('', 'SLA used', Math.round(pct) + '%')) + '"><span class="num" style="min-width:58px">' + U.fmtDur(r.durationSec) + '</span><span class="bar"><i style="width:' + Math.min(100, pct) + '%;background:' + col + '"></i></span></div>';
  }
  function histCell(r) {
    const max = Math.max.apply(null, r.history.map((h) => h.durationSec || 0).concat([1]));
    return '<div class="mini-hist">' + r.history.map((h) => '<i style="height:' + Math.max(3, 18 * (h.durationSec || 0) / max) + 'px;background:' + (h.status === 'failed' ? 'var(--fail)' : 'rgba(148,170,210,0.45)') + '"></i>').join('') + '</div>';
  }
  function cell(k, r) {
    switch (k) {
      case 'name': return '<td><div class="pname">' + U.esc(r.name) + '</div><div class="pid">' + '<span class="chip">' + r.platformShort + '</span> ' + r.id + (r.openAlerts ? ' · <span style="color:#ff9a9a">' + r.openAlerts + ' alert' + (r.openAlerts > 1 ? 's' : '') + '</span>' : '') + '</div></td>';
      case 'domain': return '<td>' + U.esc(r.domain) + '</td>';
      case 'st': return '<td><div class="st">' + U.esc(r.source) + '<span class="arrow-r">→</span>' + U.esc(r.target) + '</div></td>';
      case 'type': return '<td class="dim">' + U.esc(r.type) + '</td>';
      case 'status': return '<td><span data-tip="' + U.esc(r.reasons.length ? '<div class="tt-h">Why</div>' + r.reasons.map((x) => '<div class="tt-r">' + U.esc(x) + '</div>').join('') : '') + '">' + ui.badge(r.status, r.status === 'running' && r.progress ? 'Running ' + Math.round(r.progress * 100) + '%' : null) + '</span></td>';
      case 'start': return '<td class="num">' + (r.startTime ? U.fmtHM(r.startTime) : '<span class="muted">sched ' + U.fmtHM(r.scheduledTime) + '</span>') + '</td>';
      case 'dur': return '<td>' + durCell(r) + '</td>';
      case 'records': return '<td class="td-r num">' + (r.recordsProcessed ? U.fmtInt(r.recordsProcessed) : '<span class="muted">—</span>') + '</td>';
      case 'last': return '<td class="dim">' + U.fmtAgo(r.lastRun) + '</td>';
      case 'sla': return '<td>' + ui.slaTag(r.slaStatus) + '</td>';
      case 'trend': return '<td>' + histCell(r) + '</td>';
    }
    return '<td></td>';
  }

  W.pipelineTable = function (el, rows, o) {
    o = o || {};
    const local = o.local || {};
    const cols = o.compact ? COLS.filter((c) => COMPACT.indexOf(c.k) >= 0) : COLS;
    if (local.sortKey) {
      const col = COLS.find((c) => c.k === local.sortKey);
      if (col && col.sort) rows = rows.slice().sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x > y ? 1 : x < y ? -1 : 0) * (local.sortDir || 1); });
    }
    if (o.limit) rows = rows.slice(0, o.limit);
    const head = '<tr>' + cols.map((c) => '<th class="' + (c.sort ? 'sortable ' : '') + (local.sortKey === c.k ? 'sorted ' : '') + (c.r ? 'td-r' : '') + '" data-k="' + c.k + '">' + c.t + (c.sort ? '<span class="arrow">' + (local.sortKey === c.k ? (local.sortDir === 1 ? '▲' : '▼') : '↕') + '</span>' : '') + '</th>').join('') + '</tr>';
    const body = rows.length ? rows.map((r) => '<tr class="clickable row-' + r.status + (o.selected === r.id ? ' selected' : '') + '" data-id="' + r.id + '">' + cols.map((c) => cell(c.k, r)).join('') + '</tr>').join('')
      : '<tr><td colspan="' + cols.length + '"><div class="empty">No pipelines match the current filters.</div></td></tr>';
    el.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    el.querySelectorAll('th.sortable').forEach((th) => th.addEventListener('click', () => {
      const k = th.getAttribute('data-k');
      if (local.sortKey === k) local.sortDir = -(local.sortDir || 1); else { local.sortKey = k; local.sortDir = 1; }
      W.pipelineTable(el, o.rawRows || rows, Object.assign({}, o, { rawRows: o.rawRows || rows }));
    }));
    el.querySelectorAll('tbody tr[data-id]').forEach((tr) => tr.addEventListener('click', () => {
      el.querySelectorAll('tr.selected').forEach((x) => x.classList.remove('selected'));
      tr.classList.add('selected');
      OC.drawer.open({ pipelineId: tr.getAttribute('data-id') });
    }));
  };

  /* ---------- Timeline (Gantt) ---------- */
  W.timeline = function (el, data, o) {
    o = o || {};
    const span = data.to - data.from;
    const pct = (t) => U.clamp(100 * (t - data.from) / span, 0, 100);
    const hours = span / 3600000;
    const step = hours > 30 ? 4 : hours > 13 ? 2 : 1;
    const ticks = [];
    const first = Math.ceil(data.from / 3600000) * 3600000;
    for (let t = first; t <= data.to; t += 3600000) { const h = new Date(t).getHours(); if (h % step === 0) ticks.push(t); }
    const grid = '<div class="gantt-grid" style="left:var(--gl)">' + ticks.map((t) => '<div class="vl" style="left:' + pct(t) + '%"></div>').join('') + '<div class="future" style="left:' + pct(data.now) + '%"></div><div class="now" style="left:' + pct(data.now) + '%"></div></div>';
    const axis = '<div class="gantt-axis"><div style="padding:6px 16px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:650">Pipeline</div><div class="ga">' + ticks.map((t) => '<span class="tick" style="left:' + pct(t) + '%">' + (new Date(t).getHours() === 0 ? '<b style="color:var(--text-2)">' + U.fmtDay(t) + '</b>' : U.fmtHM(t)) + '</span>').join('') + '</div></div>';
    let rows = data.rows;
    if (o.onlyIssues) rows = rows.filter((r) => ['success', 'running'].indexOf(r.health) < 0);
    const order = { failed: 0, delayed: 1, blocked: 2, warning: 3, running: 4, queued: 5, success: 6 };
    if (o.sortBy === 'status') rows = rows.slice().sort((a, b) => order[a.health] - order[b.health]);
    let html = '';
    const renderRow = (r) => {
      const bars = r.bars.map((b) => {
        const left = pct(b.start), width = Math.max(0.25, pct(b.end) - left);
        let cls = b.planned ? 'planned' : b.notStarted ? 'notstarted ' + b.status : b.status;
        if (b.sla && b.status === 'success') cls += ' sla';
        const tipH = '<div class="tt-h">' + U.esc(r.name) + '</div>' +
          ui.ttRow((ui.STATUS[b.status] || ui.STATUS.pending).color, 'Status', b.planned ? 'Planned' : b.notStarted ? (b.status === 'delayed' ? 'Not started (late)' : ui.STATUS[b.status].label) : ui.STATUS[b.status].label + (b.retries ? ' · ' + b.retries + ' retr' + (b.retries > 1 ? 'ies' : 'y') : '')) +
          ui.ttRow('', b.notStarted || b.planned ? 'Scheduled' : 'Start', U.fmtDateTime(b.notStarted || b.planned ? b.scheduled : b.start)) +
          (b.notStarted || b.planned ? '' : ui.ttRow('', b.running ? 'Elapsed' : 'Duration', U.fmtDur(b.durationSec))) +
          (b.records ? ui.ttRow('', 'Records', U.fmtInt(b.records)) : '') +
          (b.sla ? ui.ttRow('var(--warn)', 'SLA', 'Breached') : '') +
          (b.reason ? '<div class="tt-r" style="margin-top:4px;max-width:260px;white-space:normal">' + U.esc(b.reason) + '</div>' : '') +
          (b.execId ? '<div class="tt-r muted" style="font-size:11px">Click to open execution</div>' : '');
        return '<div class="gbar ' + cls + '" style="left:' + left + '%;width:' + width + '%" data-exec="' + (b.execId || '') + '" data-pid="' + r.id + '" data-tip="' + U.esc(tipH) + '"></div>';
      }).join('');
      return '<div class="gantt-row"><div class="gl" data-pid="' + r.id + '">' + ui.dot(r.health) + '<span class="nm">' + U.esc(r.name) + '</span></div><div class="gt">' + bars + '</div></div>';
    };
    if (o.group) {
      const g = U.groupBy(rows, (r) => r.domain);
      Object.keys(g).sort().forEach((d) => { html += '<div class="gantt-group">' + U.esc(d) + ' · ' + g[d].length + '</div>' + g[d].map(renderRow).join(''); });
    } else html = rows.map(renderRow).join('');
    el.innerHTML = '<div class="gantt">' + axis + '<div style="position:relative">' + grid + html + '</div></div>';
    el.querySelectorAll('.gbar[data-exec]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.exec) { ui.tip.hide(); OC.drawer.open({ pipelineId: b.dataset.pid, execId: b.dataset.exec, tab: 'flow' }); } }));
    el.querySelectorAll('.gl[data-pid]').forEach((b) => b.addEventListener('click', () => OC.drawer.open({ pipelineId: b.dataset.pid })));
  };
  W.timelineLegend = function () {
    const sw = (bg, label, extra) => '<span class="lg"><span class="sw" style="background:' + bg + ';' + (extra || '') + '"></span>' + label + '</span>';
    return '<div class="legend">' + sw('var(--ok)', 'Success') + sw('var(--fail)', 'Failed') + sw('var(--run)', 'Running') + sw('var(--warn)', 'Delayed / over SLA') + sw('transparent', 'Not started / blocked', 'border:1px dashed var(--warn)') + sw('transparent', 'Planned', 'border:1px dashed var(--queue)') + '</div>';
  };

  /* ---------- Alert list ---------- */
  W.alertList = function (el, alerts, o) {
    o = o || {};
    if (!alerts.length) { el.innerHTML = '<div class="empty">' + ui.icon('checkCircle', 'lg') + '<div style="margin-top:8px">No alerts for the current filters.</div></div>'; return; }
    el.innerHTML = '<div class="alert-list">' + alerts.map((a) => {
      const col = ui.SEV[a.severity].color;
      return '<div class="alert ' + (o.compact ? 'compact ' : '') + (a.status === 'resolved' ? 'resolved' : '') + '" data-id="' + a.id + '">' +
        '<div class="stripe" style="background:' + col + '"></div>' +
        '<div style="min-width:0"><div class="a-top">' + ui.sevTag(a.severity) + '<span class="a-title">' + U.esc(a.title) + '</span>' + (o.compact ? '' : '<span class="type-tag">' + ui.ALERT_TYPES[a.type] + '</span>') + '</div>' +
        '<div class="a-desc">' + U.esc(a.description) + '</div>' +
        '<div class="a-meta"><span>' + ui.icon('clock', 'sm') + U.fmtAgo(a.ts) + '</span><span>' + ui.icon('layers', 'sm') + U.esc(a.pipelineName) + '</span>' + (o.compact ? '' : '<span>' + ui.icon('user', 'sm') + 'Owner: ' + U.esc(a.owner) + '</span><span class="mono muted">' + a.id + '</span>') + '</div></div>' +
        '<div class="a-act"><span class="pill ' + a.status + '">' + a.status.charAt(0).toUpperCase() + a.status.slice(1) + '</span>' +
        '<div style="display:flex;gap:6px">' + (!o.compact && a.status === 'open' ? '<button class="btn sm ghost" data-act="ack">Acknowledge</button>' : '') + (!o.compact && a.status !== 'resolved' ? '<button class="btn sm ghost" data-act="resolve">Resolve</button>' : '') + '<button class="btn sm" data-act="view">View details ' + ui.icon('chevR', 'sm') + '</button></div></div></div>';
    }).join('') + '</div>';
    el.querySelectorAll('.alert').forEach((row) => {
      const a = alerts.find((x) => x.id === row.dataset.id);
      row.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const act = b.dataset.act;
        if (act === 'view') OC.drawer.open({ pipelineId: a.pipelineId, tab: a.type === 'data_quality' ? 'dq' : a.type === 'failure' || a.type === 'retry' || a.type === 'long_running' ? 'flow' : 'overview' });
        else OC.api.updateAlert(OC.store.filters().env, a.id, { status: act === 'ack' ? 'acknowledged' : 'resolved' }).then(() => { ui.toast(a.id + ' ' + (act === 'ack' ? 'acknowledged' : 'resolved')); OC.app.refresh(true); });
      }));
    });
  };

  /* ---------- Horizontal bar list ---------- */
  W.hbars = function (el, items, o) {
    o = o || {};
    const max = o.max || Math.max.apply(null, items.map((i) => Math.max(i.value || 0, i.marker || 0)).concat([1]));
    el.innerHTML = '<div class="hbar-list">' + items.map((it) => '<div class="hbar ' + (it.id ? 'clickable' : '') + '" data-id="' + (it.id || '') + '"' + (it.tip ? ' data-tip="' + U.esc(it.tip) + '"' : '') + '><span class="hl" title="' + U.esc(it.label) + '">' + U.esc(it.label) + '</span><span class="ht"><i style="width:' + (100 * (it.value || 0) / max) + '%;background:' + (it.color || 'var(--s1)') + '"></i>' + (it.marker != null ? '<span class="mk" style="left:' + Math.min(100, 100 * it.marker / max) + '%"></span>' : '') + '</span><span class="hv">' + (o.fmt ? o.fmt(it.value, it) : it.value) + '</span></div>').join('') + '</div>';
    el.querySelectorAll('.hbar[data-id]').forEach((h) => { if (h.dataset.id) h.addEventListener('click', () => OC.drawer.open({ pipelineId: h.dataset.id })); });
  };

  OC.widgets = W;
})(window.OpsCenter);

  <script>
/* ==========================================================================
   Monitor views — Overview, Pipelines, Timeline, Alerts
   Each view: { title, subtitle, render(el, filters) } → fetches via OC.api.
   ========================================================================== */
(function (OC) {
  'use strict';
  const U = OC.utils, ui = OC.ui, W = OC.widgets, C = OC.charts, api = OC.api;
  OC.views = OC.views || {};
  const RANGE_LBL = { '24h': 'prior 24h', '7d': 'prior 7d', '30d': 'prior 30d' };

  function delta(cur, prev, opts) {
    opts = opts || {};
    if (prev == null || (prev === 0 && cur === 0)) return '<span class="k-delta">no change</span>';
    const d = opts.abs ? cur - prev : (prev ? 100 * (cur - prev) / prev : 100);
    if (Math.abs(d) < 0.05) return '<span class="k-delta">no change ' + (opts.vs || '') + '</span>';
    const up = d > 0;
    const good = opts.upIsGood ? up : !up;
    const txt = (up ? '↑ ' : '↓ ') + (opts.abs ? (opts.unit === 'pts' ? Math.abs(d).toFixed(1) + ' pts' : Math.abs(Math.round(d))) : Math.abs(d).toFixed(1) + '%');
    return '<span class="k-delta"><span class="' + (good ? 'delta-up-good' : 'delta-up-bad') + '">' + txt + '</span> ' + (opts.vs || '') + '</span>';
  }

  function kpiCard(o) {
    return '<div class="card kpi fade-in" style="--kc:' + o.color + ';--kcs:' + o.soft + '" data-go="' + (o.go || '') + '" data-chip="' + (o.chip || '') + '">' +
      '<div class="k-top"><span class="k-ic">' + ui.icon(o.icon) + '</span>' + o.label + '</div>' +
      '<div class="k-val num">' + o.value + '</div>' +
      '<div class="k-foot"><div>' + o.delta + (o.sub ? '<div class="k-sub">' + o.sub + '</div>' : '') + '</div>' + (o.spark ? '<div>' + C.sparkline(o.spark, o.sparkColor || o.colorHex, 70, 24) + '</div>' : '') + '</div></div>';
  }

  /* ======================================================================
     OVERVIEW
     ====================================================================== */
  OC.views.overview = {
    title: 'Overview',
    subtitle: 'Platform health at a glance — failures, SLA risk and what to investigate first.',
    async render(el, f) {
      const [o, rows, alerts, tl, sla, dq, dm] = await Promise.all([
        api.getOverview(f), api.getPipelines(f), api.getAlerts(f), api.getTimeline(f, 24), api.getSla(f), api.getDataQuality(f), api.getDataMetrics(f)
      ]);
      const c = o.counts, vs = 'vs ' + RANGE_LBL[o.range];
      const bannerCls = o.health.label === 'Healthy' ? 'ok' : c.failed ? 'crit' : 'warn';
      const top = o.priorities[0];
      const issues = [];
      if (c.failed) issues.push(c.failed + ' failed');
      if (c.delayed) issues.push(c.delayed + ' delayed');
      if (c.blocked) issues.push(c.blocked + ' blocked downstream');
      if (sla.counts.breached) issues.push(sla.counts.breached + ' SLA breach' + (sla.counts.breached > 1 ? 'es' : ''));
      if (dq.totals.fail) issues.push(dq.totals.fail + ' DQ check failures');

      el.innerHTML =
        '<div class="banner ' + bannerCls + ' fade-in">' +
          '<div class="b-icon">' + ui.icon(bannerCls === 'ok' ? 'checkCircle' : bannerCls === 'crit' ? 'xCircle' : 'alert', 'lg') + '</div>' +
          '<div style="min-width:0"><div class="b-title">PLATFORM ' + o.health.label.toUpperCase() + ' <span class="muted" style="font-weight:500;font-size:12px;margin-left:6px">' + f.env.toUpperCase() + ' · health score ' + o.health.score + '/100</span></div>' +
          '<div class="b-sub">' + (issues.length ? issues.join(' · ') : 'All pipelines healthy and within SLA.') + (top ? ' — <b style="color:var(--text)">Investigate first:</b> <a href="#" data-open="' + top.pipelineId + '">' + U.esc(top.name) + ' →</a>' : '') + '</div></div>' +
          '<div class="b-stats"><div class="b-stat"><div class="v num">' + o.openAlerts.total + '</div><div class="l">Open alerts</div></div><div class="b-stat"><div class="v num" style="color:#ff8080">' + o.openAlerts.critical + '</div><div class="l">Critical</div></div><div class="b-stat"><div class="v num">' + U.fmtPct(sla.compliance) + '</div><div class="l">SLA compliance</div></div></div>' +
        '</div>' +
        '<div class="kpis">' +
          kpiCard({ label: 'Total Pipelines', icon: 'layers', value: c.total, color: 'var(--accent)', soft: 'var(--accent-soft)', colorHex: '#4c8dff', delta: '<span class="k-delta">' + U.fmtInt(o.runs) + ' runs ' + (o.range === '24h' ? 'today' : 'in ' + o.range) + '</span>', spark: o.spark.runs, go: 'pipelines', chip: 'all' }) +
          kpiCard({ label: 'Running', icon: 'play', value: c.running, color: 'var(--run)', soft: 'var(--run-soft)', colorHex: '#3b8ef0', delta: '<span class="k-delta">' + (c.delayed ? '<span class="delta-up-bad">+' + rows.filter((r) => r.status === 'delayed' && r.execStatus === 'running').length + ' running over SLA</span>' : 'all within SLA') + '</span>', spark: o.spark.running, go: 'pipelines', chip: 'running' }) +
          kpiCard({ label: 'Successful', icon: 'checkCircle', value: c.success, color: 'var(--ok)', soft: 'var(--ok-soft)', colorHex: '#22b357', delta: '<span class="k-delta">+' + c.warning + ' with warnings</span>', spark: o.spark.success, go: 'pipelines', chip: 'success' }) +
          kpiCard({ label: 'Failed', icon: 'xCircle', value: c.failed, color: 'var(--fail)', soft: 'var(--fail-soft)', colorHex: '#ef4c4c', delta: delta(o.failedRuns, o.failedRunsPrev, { abs: true, vs: 'runs ' + vs }), spark: o.spark.failed, go: 'pipelines', chip: 'failed' }) +
          kpiCard({ label: 'Warning / Delayed', icon: 'clock', value: c.warning + c.delayed, color: 'var(--warn)', soft: 'var(--warn-soft)', colorHex: '#f5a524', delta: '<span class="k-delta">' + c.delayed + ' delayed · ' + c.warning + ' warnings</span>', spark: o.spark.sla, go: 'pipelines', chip: 'warn' }) +
          kpiCard({ label: 'Queued / Blocked', icon: 'hourglass', value: c.queued + c.blocked, color: 'var(--queue)', soft: 'var(--queue-soft)', colorHex: '#8a97ad', delta: '<span class="k-delta">' + (c.blocked ? '<span style="color:#cdb2ff">' + c.blocked + ' blocked by upstream</span>' : c.queued + ' waiting') + '</span>', spark: o.spark.queue, go: 'pipelines', chip: 'queued' }) +
          kpiCard({ label: 'Success Rate', icon: 'percent', value: o.successRate.toFixed(1) + '<small>%</small>', color: o.successRate >= 98 ? 'var(--ok)' : 'var(--warn)', soft: o.successRate >= 98 ? 'var(--ok-soft)' : 'var(--warn-soft)', colorHex: o.successRate >= 98 ? '#22b357' : '#f5a524', delta: delta(o.successRate, o.successRatePrev, { abs: true, unit: 'pts', upIsGood: true, vs: vs }), spark: o.spark.rate, go: 'metrics' }) +
          kpiCard({ label: 'Data Processed (' + o.range + ')', icon: 'database', value: U.fmtGB(o.dataGB).replace(/ (TB|GB|MB)/, '<small>$1</small>'), color: 'var(--s5)', soft: 'rgba(144,133,233,0.15)', colorHex: '#9085e9', delta: delta(o.dataGB, o.dataGBPrev, { upIsGood: true, vs: vs }), sub: U.fmtNum(o.records) + ' records', spark: o.spark.gb, go: 'metrics' }) +
        '</div>' +
        '<div class="grid g-12">' +
          '<div class="card span-7"><div class="card-h">' + ui.icon('zap') + '<h3>Where to investigate first</h3><span class="sub">ranked by severity × downstream impact</span><div class="right"><button class="link-btn" data-go="alerts">All alerts ' + ui.icon('chevR', 'sm') + '</button></div></div><div class="card-b flush" id="ov-prio"></div></div>' +
          '<div class="card span-5"><div class="card-h">' + ui.icon('bell') + '<h3>Active alerts</h3><span class="sub">' + alerts.filter((a) => a.status !== 'resolved').length + ' open / acknowledged</span><div class="right"><button class="link-btn" data-go="alerts">Alert center ' + ui.icon('chevR', 'sm') + '</button></div></div><div class="card-b flush" id="ov-alerts" style="max-height:372px;overflow:auto"></div></div>' +
          '<div class="card span-12"><div class="card-h">' + ui.icon('gantt') + '<h3>Pipeline execution timeline</h3><span class="sub">last 24 hours · now marker · dashed = not started / planned</span><div class="right">' + W.timelineLegend() + '<button class="link-btn" data-go="timeline">Full timeline ' + ui.icon('chevR', 'sm') + '</button></div></div><div class="card-b flush" id="ov-tl" style="max-height:360px;overflow:auto"></div></div>' +
          '<div class="card span-8"><div class="card-h">' + ui.icon('table') + '<h3>Pipeline health</h3><span class="sub">issues first · click a row for details</span><div class="right"><button class="link-btn" data-go="pipelines">All ' + rows.length + ' pipelines ' + ui.icon('chevR', 'sm') + '</button></div></div><div class="card-b flush" id="ov-table"></div></div>' +
          '<div class="span-4" style="display:flex;flex-direction:column;gap:16px">' +
            '<div class="card"><div class="card-h">' + ui.icon('activity') + '<h3>Current status distribution</h3></div><div class="card-b" id="ov-donut"></div></div>' +
            '<div class="card"><div class="card-h">' + ui.icon('gauge') + '<h3>SLA compliance</h3><span class="sub">' + o.range + ' · ' + sla.runsEvaluated + ' runs</span><div class="right"><button class="link-btn" data-go="sla">Details ' + ui.icon('chevR', 'sm') + '</button></div></div><div class="card-b" id="ov-gauge"></div></div>' +
            '<div class="card"><div class="card-h">' + ui.icon('shield') + '<h3>Data quality</h3><div class="right"><button class="link-btn" data-go="quality">Details ' + ui.icon('chevR', 'sm') + '</button></div></div><div class="card-b" id="ov-dq"></div></div>' +
          '</div>' +
          '<div class="card span-6"><div class="card-h">' + ui.icon('bars') + '<h3>Records processed</h3><span class="sub">' + (o.range === '24h' ? 'per hour' : 'per day') + '</span></div><div class="card-b" id="ov-records"></div></div>' +
          '<div class="card span-6"><div class="card-h">' + ui.icon('trend') + '<h3>Run outcomes</h3><span class="sub">' + (o.range === '24h' ? 'per hour' : 'per day') + '</span></div><div class="card-b" id="ov-outcomes"></div></div>' +
        '</div>';

      // priorities
      const pe = U.$('#ov-prio', el);
      pe.innerHTML = o.priorities.length ? '<div class="prio">' + o.priorities.map((p, i) =>
        '<div class="prio-item" data-open="' + p.pipelineId + '"><span class="rank">' + (i + 1) + '</span><div style="min-width:0"><div class="t">' + U.esc(p.name) + ' ' + ui.badge(p.health, p.kind) + (p.impact ? '<span class="impact">' + ui.icon('network', 'sm').replace('class="icon sm"', 'class="icon sm" style="display:inline;vertical-align:-2px"') + ' ' + p.impact + ' downstream</span>' : '') + '</div><div class="r">' + U.esc(p.reason) + '</div></div><div class="meta">' + U.fmtAgo(p.since) + '<div>' + U.esc(p.owner) + '</div></div></div>').join('') + '</div>'
        : '<div class="empty">' + ui.icon('checkCircle', 'lg') + '<div>Nothing needs attention.</div></div>';
      W.alertList(U.$('#ov-alerts', el), alerts.filter((a) => a.status !== 'resolved').sort((a, b) => sevRank(a) - sevRank(b) || b.ts - a.ts).slice(0, 6), { compact: true });
      W.timeline(U.$('#ov-tl', el), tl, { sortBy: 'status' });
      const order = ['failed', 'delayed', 'blocked', 'warning', 'running', 'queued', 'success'];
      W.pipelineTable(U.$('#ov-table', el), rows.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status)), { compact: true, limit: 10 });
      const go = (chip) => () => { OC.store.local('pipelines').chip = chip; OC.app.nav('pipelines'); };
      C.donut(U.$('#ov-donut', el), {
        size: 132, thickness: 15, center: { value: c.total, label: 'pipelines' },
        segments: [
          { label: 'Success', value: c.success, color: '#22b357', onClick: go('success') },
          { label: 'Running', value: c.running, color: '#3b8ef0', onClick: go('running') },
          { label: 'Warning / Delayed', value: c.warning + c.delayed, color: '#f5a524', onClick: go('warn') },
          { label: 'Failed', value: c.failed, color: '#ef4c4c', onClick: go('failed') },
          { label: 'Queued / Blocked', value: c.queued + c.blocked, color: '#8a97ad', onClick: go('queued') }
        ]
      });
      C.gauge(U.$('#ov-gauge', el), { value: sla.compliance, min: 90, max: 100, target: 98, label: 'target 98% · ' + sla.breachedRuns + ' breached runs', width: 230 });
      U.$('#ov-gauge', el).insertAdjacentHTML('beforeend', '<div style="display:flex;justify-content:space-around;margin-top:6px;font-size:12px"><span class="sla-met">' + sla.counts.met + ' within</span><span class="sla-at_risk">' + sla.counts.at_risk + ' at risk</span><span class="sla-breached">' + sla.counts.breached + ' breached</span></div>');
      const t = dq.totals;
      U.$('#ov-dq', el).innerHTML = '<div class="stat-row" style="grid-template-columns:repeat(4,1fr);margin:0"><div class="stat"><div class="l">Checks</div><div class="v num">' + t.total + '</div></div><div class="stat"><div class="l sla-met">' + ui.icon('check', 'sm') + 'Passed</div><div class="v num">' + t.pass + '</div></div><div class="stat"><div class="l sla-at_risk">' + ui.icon('alert', 'sm') + 'Warn</div><div class="v num">' + t.warn + '</div></div><div class="stat"><div class="l sla-breached">' + ui.icon('x', 'sm') + 'Failed</div><div class="v num">' + t.fail + '</div></div></div>' +
        (dq.issues.length ? '<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">' + dq.issues.slice(0, 3).map((i) => '<div style="display:flex;gap:8px;align-items:center;font-size:12px;cursor:pointer" data-open-dq="' + i.pipelineId + '"><span class="dq-cell ' + i.status + '" style="width:20px;height:20px">' + ui.icon(i.status === 'fail' ? 'x' : 'alert') + '</span><b style="font-weight:600">' + U.esc(i.pipelineName) + '</b><span class="dim" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + U.esc(i.name) + '</span></div>').join('') + '</div>' : '');
      C.bars(U.$('#ov-records', el), { labels: dm.series.map((s) => s.label), series: [{ name: 'Records read', color: '#3987e5', values: dm.series.map((s) => s.records) }], height: 190 });
      C.bars(U.$('#ov-outcomes', el), { labels: dm.series.map((s) => s.label), stacked: true, height: 190, yFmt: (v) => U.fmtInt(v), series: [{ name: 'Success', color: '#22b357', values: dm.series.map((s) => s.success) }, { name: 'Succeeded after retry', color: '#f5a524', values: dm.series.map((s) => s.retried) }, { name: 'Failed', color: '#ef4c4c', values: dm.series.map((s) => s.failed) }] });

      bindCommon(el);
    }
  };
  const sevRank = (a) => ['critical', 'high', 'medium', 'low'].indexOf(a.severity);

  function bindCommon(el) {
    U.$$('[data-open]', el).forEach((b) => b.addEventListener('click', (ev) => { ev.preventDefault(); OC.drawer.open({ pipelineId: b.dataset.open }); }));
    U.$$('[data-open-dq]', el).forEach((b) => b.addEventListener('click', () => OC.drawer.open({ pipelineId: b.dataset.openDq, tab: 'dq' })));
    U.$$('[data-go]', el).forEach((b) => b.addEventListener('click', () => { if (!b.dataset.go) return; if (b.dataset.chip) OC.store.local('pipelines').chip = b.dataset.chip; OC.app.nav(b.dataset.go); }));
  }
  OC.views._bindCommon = bindCommon;

  /* ======================================================================
     PIPELINES
     ====================================================================== */
  const CHIPS = [
    { id: 'all', label: 'All', match: () => true, color: 'var(--accent)' },
    { id: 'failed', label: 'Failed', match: (r) => r.status === 'failed', color: 'var(--fail)' },
    { id: 'warn', label: 'Warning / Delayed', match: (r) => r.status === 'warning' || r.status === 'delayed', color: 'var(--warn)' },
    { id: 'running', label: 'Running', match: (r) => r.status === 'running', color: 'var(--run)' },
    { id: 'queued', label: 'Queued / Blocked', match: (r) => r.status === 'queued' || r.status === 'blocked', color: 'var(--queue)' },
    { id: 'success', label: 'Success', match: (r) => r.status === 'success', color: 'var(--ok)' }
  ];
  OC.views.pipelines = {
    title: 'Pipelines',
    subtitle: 'Every pipeline across platforms with its latest execution. Search, filter, sort and drill in.',
    async render(el, f) {
      const local = OC.store.local('pipelines');
      local.chip = local.chip || 'all';
      const opts = await api.getFilterOptions(f);
      const all = await api.getPipelines(f);
      el.innerHTML = '<div class="card"><div class="toolbar">' +
        '<div class="input-wrap">' + ui.icon('search') + '<input class="input" id="pl-q" placeholder="Search name, id, owner, source, target…" value="' + U.esc(local.q || '') + '"></div>' +
        '<div class="status-chips" id="pl-chips"></div>' +
        '<div style="margin-left:auto;display:flex;gap:8px;align-items:center">' +
          '<select class="sel ' + (f.domain ? 'set' : '') + '" id="pl-domain"><option value="">All domains</option>' + opts.domains.map((d) => '<option ' + (f.domain === d ? 'selected' : '') + '>' + d + '</option>').join('') + '</select>' +
          '<select class="sel" id="pl-env">' + opts.environments.map((e) => '<option value="' + e.id + '" ' + (f.env === e.id ? 'selected' : '') + '>' + e.label + '</option>').join('') + '</select>' +
          '<button class="btn" id="pl-export">' + ui.icon('download', 'sm') + 'Export CSV</button>' +
        '</div></div><div id="pl-table"></div><div class="muted" style="padding:10px 16px;font-size:11.5px" id="pl-foot"></div></div>';
      const draw = () => {
        const q = (local.q || '').toLowerCase();
        const base = all.filter((r) => !q || [r.name, r.id, r.owner, r.source, r.target, r.domain, r.platformName, r.type].join(' ').toLowerCase().indexOf(q) >= 0);
        U.$('#pl-chips', el).innerHTML = CHIPS.map((c) => '<span class="schip ' + (local.chip === c.id ? 'active' : '') + '" data-chip="' + c.id + '"><span class="d" style="background:' + c.color + '"></span>' + c.label + ' <span class="n">' + base.filter(c.match).length + '</span></span>').join('');
        U.$$('.schip', el).forEach((s) => s.addEventListener('click', () => { local.chip = s.dataset.chip; draw(); }));
        const chip = CHIPS.find((c) => c.id === local.chip);
        const rows = base.filter(chip.match);
        local.rows = rows;
        W.pipelineTable(U.$('#pl-table', el), rows, { local, selected: OC.drawer.currentPipeline() });
        U.$('#pl-foot', el).textContent = 'Showing ' + rows.length + ' of ' + all.length + ' pipelines · ' + f.env.toUpperCase() + ' · data refreshed ' + U.fmtTime(Date.now());
      };
      draw();
      U.$('#pl-q', el).addEventListener('input', U.debounce((ev) => { local.q = ev.target.value; draw(); }, 150));
      U.$('#pl-domain', el).addEventListener('change', (ev) => OC.store.setFilters({ domain: ev.target.value }));
      U.$('#pl-env', el).addEventListener('change', (ev) => OC.store.setFilters({ env: ev.target.value }));
      U.$('#pl-export', el).addEventListener('click', () => {
        const rows = local.rows || all;
        const head = ['id', 'name', 'platform', 'domain', 'source', 'target', 'type', 'status', 'start_time', 'duration_sec', 'records', 'last_run', 'sla_status', 'owner'];
        const csv = [head.join(',')].concat(rows.map((r) => [r.id, r.name, r.platformName, r.domain, r.source, r.target, r.type, r.status, r.startTime ? new Date(r.startTime).toISOString() : '', Math.round(r.durationSec || 0), r.recordsProcessed || 0, new Date(r.lastRun).toISOString(), r.slaStatus, r.owner].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(','))).join('\n');
        U.downloadText('pipelines_' + f.env + '.csv', csv);
      });
    }
  };

  /* ======================================================================
     TIMELINE
     ====================================================================== */
  OC.views.timeline = {
    title: 'Execution Timeline',
    subtitle: 'Gantt view of every execution — spot long-running, overlapping, failed, late and not-started pipelines.',
    async render(el, f) {
      const local = OC.store.local('timeline');
      local.hours = local.hours || 24; local.sort = local.sort || 'group';
      const tl = await api.getTimeline(f, local.hours);
      const bars = [].concat.apply([], tl.rows.map((r) => r.bars.map((b) => Object.assign({ pipeline: r.name }, b))));
      const real = bars.filter((b) => !b.planned && !b.notStarted);
      // peak concurrency
      const evts = []; real.forEach((b) => { evts.push([b.start, 1]); evts.push([b.end, -1]); });
      evts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let cur = 0, peak = 0, peakAt = null; evts.forEach((e) => { cur += e[1]; if (cur > peak) { peak = cur; peakAt = e[0]; } });
      const longest = real.filter((b) => !b.running || true).sort((a, b) => b.durationSec - a.durationSec)[0];
      el.innerHTML =
        '<div class="stat-row">' +
          stat('Executions in window', U.fmtInt(real.length), real.filter((b) => b.running).length + ' running now') +
          stat('Failed', '<span style="color:#ff8080">' + real.filter((b) => b.status === 'failed').length + '</span>', 'executions') +
          stat('Over SLA', '<span style="color:#ffc15a">' + real.filter((b) => b.sla).length + '</span>', 'finished or running late') +
          stat('Not started / blocked', bars.filter((b) => b.notStarted).length, 'past scheduled time') +
          stat('Peak concurrency', peak, peakAt ? 'at ' + U.fmtHM(peakAt) : '') +
          stat('Longest run', longest ? U.fmtDur(longest.durationSec) : '—', longest ? U.esc(longest.pipeline) : '') +
        '</div>' +
        '<div class="card"><div class="card-h"><div class="seg" id="tl-hours">' + [6, 12, 24, 48].map((h) => '<button class="' + (local.hours === h ? 'active' : '') + '" data-h="' + h + '">' + h + 'h</button>').join('') + '</div>' +
        '<div class="seg" id="tl-sort"><button data-s="group" class="' + (local.sort === 'group' ? 'active' : '') + '">Group by domain</button><button data-s="status" class="' + (local.sort === 'status' ? 'active' : '') + '">Issues first</button></div>' +
        '<label class="toggle ' + (local.issues ? 'on' : '') + '" id="tl-issues"><span class="sw"></span>Only pipelines with issues</label>' +
        '<div class="right">' + W.timelineLegend() + '</div></div><div class="card-b flush" id="tl-body"></div></div>';
      W.timeline(U.$('#tl-body', el), tl, { group: local.sort === 'group', sortBy: local.sort, onlyIssues: local.issues });
      U.$$('#tl-hours button', el).forEach((b) => b.addEventListener('click', () => { local.hours = +b.dataset.h; OC.app.render(); }));
      U.$$('#tl-sort button', el).forEach((b) => b.addEventListener('click', () => { local.sort = b.dataset.s; OC.app.render(); }));
      U.$('#tl-issues', el).addEventListener('click', () => { local.issues = !local.issues; OC.app.render(); });
    }
  };
  function stat(l, v, s, ic) { return '<div class="stat"><div class="l">' + (ic ? ui.icon(ic, 'sm') : '') + l + '</div><div class="v num">' + v + '</div><div class="s">' + (s || '&nbsp;') + '</div></div>'; }
  OC.views._stat = stat;

  /* ======================================================================
     ALERTS
     ====================================================================== */
  OC.views.alerts = {
    title: 'Failure & Alert Center',
    subtitle: 'Failures, SLA breaches, data-quality issues, missing data, dependency and infrastructure events.',
    async render(el, f) {
      const local = OC.store.local('alerts');
      local.type = local.type || 'all'; local.status = local.status || 'active';
      const all = await api.getAlerts(Object.assign({}, f, { severity: '' }));
      const active = all.filter((a) => a.status !== 'resolved');
      const sevSel = f.severity || local.sev || '';
      const sc = (s) => active.filter((a) => a.severity === s).length;
      el.innerHTML = '<div class="sev-cards">' +
        ['critical', 'high', 'medium', 'low'].map((s) => '<div class="card sev-card ' + (sevSel === s ? 'active' : '') + '" data-sev="' + s + '" style="border-top:3px solid ' + ui.SEV[s].color + '"><div class="l">' + ui.icon(ui.SEV[s].icon, 'sm') + ui.SEV[s].label + '</div><div class="v num">' + sc(s) + '</div><div class="muted" style="font-size:11px">active</div></div>').join('') +
        '<div class="card sev-card ' + (!sevSel ? 'active' : '') + '" data-sev=""><div class="l">' + ui.icon('bell', 'sm') + 'All active</div><div class="v num">' + active.length + '</div><div class="muted" style="font-size:11px">' + all.filter((a) => a.status === 'open').length + ' unacknowledged</div></div>' +
        '</div>' +
        '<div class="card"><div class="tabs" id="al-tabs"></div><div class="toolbar" style="border-bottom:0;padding-bottom:4px"><div class="seg" id="al-status">' + [['active', 'Active'], ['open', 'Open'], ['acknowledged', 'Acknowledged'], ['resolved', 'Resolved'], ['all', 'All']].map((x) => '<button data-s="' + x[0] + '" class="' + (local.status === x[0] ? 'active' : '') + '">' + x[1] + '</button>').join('') + '</div><span class="muted" id="al-count" style="margin-left:auto;font-size:12px"></span></div><div id="al-list"></div></div>';
      const types = ['all'].concat(Object.keys(ui.ALERT_TYPES));
      const base = all.filter((a) => !sevSel || a.severity === sevSel).filter((a) => local.status === 'all' ? true : local.status === 'active' ? a.status !== 'resolved' : a.status === local.status);
      U.$('#al-tabs', el).innerHTML = types.filter((t) => t === 'all' || all.some((a) => a.type === t)).map((t) => '<button class="tab ' + (local.type === t ? 'active' : '') + '" data-t="' + t + '">' + (t === 'all' ? 'All' : ui.ALERT_TYPES[t]) + ' <span class="c">' + base.filter((a) => t === 'all' || a.type === t).length + '</span></button>').join('');
      const list = base.filter((a) => local.type === 'all' || a.type === local.type).sort((a, b) => sevRank(a) - sevRank(b) || b.ts - a.ts);
      U.$('#al-count', el).textContent = list.length + ' alerts · sorted by severity, then most recent';
      W.alertList(U.$('#al-list', el), list, {});
      U.$$('[data-sev]', el).forEach((c) => c.addEventListener('click', () => { local.sev = c.dataset.sev; if (f.severity) OC.store.setFilters({ severity: '' }); else OC.app.render(); }));
      U.$$('#al-tabs .tab', el).forEach((b) => b.addEventListener('click', () => { local.type = b.dataset.t; OC.app.render(); }));
      U.$$('#al-status button', el).forEach((b) => b.addEventListener('click', () => { local.status = b.dataset.s; OC.app.render(); }));
    }
  };
})(window.OpsCenter);

</script>
  <script>
/* ==========================================================================
   Analytics views — Data Metrics, Operations, SLA, Data Quality, Dependencies
   ========================================================================== */
(function (OC) {
  'use strict';
  const U = OC.utils, ui = OC.ui, W = OC.widgets, C = OC.charts, api = OC.api;
  const stat = (l, v, s, ic) => OC.views._stat(l, v, s, ic);
  const card = (id, icon, title, sub, span, right) => '<div class="card ' + span + '"><div class="card-h">' + ui.icon(icon) + '<h3>' + title + '</h3>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + (right ? '<div class="right">' + right + '</div>' : '') + '</div><div class="card-b" id="' + id + '"></div></div>';
  const per = (r) => r === '24h' ? 'per hour' : 'per day';
  const S = { s1: '#3987e5', s2: '#d95926', s3: '#199e70', s4: '#c98500', s5: '#9085e9', ok: '#22b357', fail: '#ef4c4c', warn: '#f5a524', run: '#3b8ef0', queue: '#8a97ad' };

  /* ======================================================================
     DATA PROCESSING METRICS
     ====================================================================== */
  OC.views.metrics = {
    title: 'Data Processing Metrics',
    subtitle: 'Records, data volume, processing time, throughput and run outcomes over time.',
    async render(el, f) {
      const local = OC.store.local('metrics'); local.dur = local.dur || 7;
      const d = await api.getDataMetrics(f);
      const t = d.totals, s = d.series, labels = s.map((x) => x.label);
      el.innerHTML = '<div class="stat-row">' +
        stat('Records processed', U.fmtNum(t.records, 2), U.fmtInt(t.runs) + ' runs · ' + f.range, 'bars') +
        stat('Input volume', U.fmtGB(t.gbIn), 'read from sources', 'download') +
        stat('Output volume', U.fmtGB(t.gbOut), Math.round(100 * t.gbOut / (t.gbIn || 1)) + '% of input after compaction', 'hdd') +
        stat('Throughput', U.fmtNum(t.recPerMin) + '<small class="muted" style="font-size:12px"> rec/min</small>', 'average across window', 'zap') +
        stat('Throughput (volume)', t.gbPerHour.toFixed(1) + '<small class="muted" style="font-size:12px"> GB/hour</small>', 'average across window', 'activity') +
        '</div><div class="grid g-12">' +

  OC.views.dependencies = {
    title: 'Dependency Monitoring',
    subtitle: 'Upstream → downstream lineage. Failures propagate: blocked and at-risk downstream pipelines are highlighted.',
    async render(el, f) {
      const d = await api.getDependencies(f);
      const failedRoots = d.nodes.filter((n) => !n.consumer && (n.status === 'failed' || n.status === 'delayed'));
      el.innerHTML = '<div class="grid g-12">' +
        '<div class="card span-12"><div class="card-h">' + ui.icon('network') + '<h3>Pipeline dependency graph</h3><span class="sub">hover a node to trace lineage · click to open</span><div class="right"><div class="legend"><span class="lg"><span class="sw" style="background:var(--fail)"></span>Failed</span><span class="lg"><span class="sw" style="background:var(--warn)"></span>Delayed</span><span class="lg"><span class="sw" style="border:1px dashed var(--blocked)"></span>Blocked</span><span class="lg"><span class="sw" style="height:2px;background:var(--fail)"></span>Broken dependency</span></div></div></div><div class="card-b" id="d-graph"></div></div>' +
        '<div class="card span-12"><div class="card-h">' + ui.icon('alert') + '<h3>Impact analysis</h3><span class="sub">failed / delayed pipelines and what they block downstream</span></div><div class="card-b" id="d-impact" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 28px"></div></div></div>';
      // layout
      const layers = U.groupBy(d.nodes, (n) => n.layer);
      const nodeH = 44, rowGap = 12, padT = 24;
      const nLayers = U.uniq(d.nodes.map((n) => n.layer)).length;
      const avail = Math.max(900, (U.$('#d-graph', el).clientWidth || 1200) - 8);
      const colGap = 44, nodeW = Math.min(200, Math.floor((avail - (nLayers - 1) * colGap) / nLayers));
      const pos = {};
      const keys = Object.keys(layers).map(Number).sort((a, b) => a - b);
      const sortKey = (n) => (n.domain || 'zz') + n.name;
      keys.forEach((L) => {
        layers[L].sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1);
        layers[L].forEach((n, i) => { pos[n.id] = { x: L * (nodeW + colGap), y: padT + i * (nodeH + rowGap) }; });
      });
      // relax: centre each non-root node on its parents
      for (let it = 0; it < 2; it++) keys.slice(1).forEach((L) => {
        const items = layers[L].map((n) => { const par = d.edges.filter((e) => e.to === n.id).map((e) => pos[e.from]).filter(Boolean); return { n, want: par.length ? U.avg(par, (p) => p.y) : pos[n.id].y }; }).sort((a, b) => a.want - b.want);
        let y = padT;
        items.forEach((it2) => { const ny = Math.max(y, it2.want); pos[it2.n.id].y = ny; y = ny + nodeH + rowGap; });
      });
      const width = keys.length * (nodeW + colGap) - colGap + 4;
      const height = Math.max.apply(null, Object.keys(pos).map((k) => pos[k].y)) + nodeH + 10;
      const LBL = ['Sources / ingest', 'Transform', 'Curated / master', 'Integrated', 'Serving', 'Consumers', 'Consumers'];
      let html = '<div class="dep-canvas" style="height:' + Math.min(height + 10, 720) + 'px"><div style="position:relative;width:' + width + 'px;height:' + height + 'px">';
      keys.forEach((L) => { html += '<div class="layer-label" style="left:' + (L * (nodeW + colGap)) + 'px">' + (L === keys[keys.length - 1] ? 'Consumers' : LBL[L] || 'Layer ' + L) + '</div>'; });
      html += '<svg class="dep-svg" width="' + width + '" height="' + height + '">' + d.edges.map((e) => {
        const a = pos[e.from], b = pos[e.to]; if (!a || !b) return '';
        const x1 = a.x + nodeW, y1 = a.y + nodeH / 2, x2 = b.x, y2 = b.y + nodeH / 2, mx = (x1 + x2) / 2;
        return '<path data-from="' + e.from + '" data-to="' + e.to + '" class="' + (e.broken ? 'broken' : '') + '" d="M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>';
      }).join('') + '</svg>';
      d.nodes.forEach((n) => {
        const p = pos[n.id];
        if (n.consumer) {
          html += '<div class="dep-node consumer ' + (n.atRisk ? 'at-risk' : '') + '" data-id="' + n.id + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + nodeW + 'px"><div class="dn-t">' + ui.icon(n.atRisk ? 'alert' : 'bars', 'sm') + U.esc(n.name) + '</div><div class="dn-s"><span>' + (n.atRisk ? '<span style="color:#ff8080">stale data risk</span>' : 'up to date') + '</span><span>consumer</span></div></div>';
        } else {
          html += '<div class="dep-node st-' + n.status + (n.impacted ? ' impacted' : '') + (n.dim ? ' faded' : '') + '" data-id="' + n.id + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + nodeW + 'px" data-tip="' + U.esc('<div class="tt-h">' + n.name + '</div>' + ui.ttRow((ui.STATUS[n.status] || ui.STATUS.pending).color, 'Status', ui.STATUS[n.status].label) + ui.ttRow('', 'Domain', n.domain) + ui.ttRow('', 'Downstream', n.downstream + ' pipelines') + (n.atRisk ? ui.ttRow('var(--blocked)', 'Impact', 'Upstream issue') : '')) + '"><div class="dn-t">' + ui.dot(n.status) + U.esc(n.name) + '</div><div class="dn-s"><span>' + ui.STATUS[n.status].label + (n.atRisk && n.status !== 'blocked' ? ' · at risk' : '') + '</span><span class="chip" style="font-size:9.5px;padding:0 4px">' + n.platform + '</span></div></div>';
